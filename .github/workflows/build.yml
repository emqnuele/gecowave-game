name: build desktop

# builda gli eseguibili su ogni OS nativo.
# si lancia a mano dalla tab Actions, o pushando un tag tipo v1.0.0
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: --win
          - os: ubuntu-latest
            platform: --linux
          - os: macos-latest
            platform: --mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # i VITE_* finiscono in chiaro nella build: i secret li tengono solo fuori dal repo
      - name: build app
        run: npm run build
        env:
          VITE_METERED_USER: ${{ secrets.VITE_METERED_USER }}
          VITE_METERED_CRED: ${{ secrets.VITE_METERED_CRED }}
          VITE_TURN_ENDPOINT: ${{ secrets.VITE_TURN_ENDPOINT }}
          VITE_OWN_TURN_HOST: ${{ secrets.VITE_OWN_TURN_HOST }}
          VITE_OWN_TURN_USER: ${{ secrets.VITE_OWN_TURN_USER }}
          VITE_OWN_TURN_CRED: ${{ secrets.VITE_OWN_TURN_CRED }}
          VITE_OWN_PEER_HOST: ${{ secrets.VITE_OWN_PEER_HOST }}
          VITE_OWN_PEER_PORT: ${{ secrets.VITE_OWN_PEER_PORT }}
          VITE_OWN_PEER_PATH: ${{ secrets.VITE_OWN_PEER_PATH }}
          VITE_OWN_PEER_KEY: ${{ secrets.VITE_OWN_PEER_KEY }}

      - name: generate icons & installer art
        run: npm run gen-icons

      - name: package
        run: npx electron-builder ${{ matrix.platform }} --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: gecowave-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
          if-no-files-found: ignore

  # quando builda da un tag, pubblica una release con gli eseguibili allegati
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: artifacts/**/*
          generate_release_notes: true
          body: |
            ## Installazione

            **Windows** — apri `GECOWAVE-Setup-*.exe` e segui il wizard. Se compare SmartScreen ("editore sconosciuto"): *Ulteriori informazioni → Esegui comunque*.

            **macOS** — apri il `.dmg` e trascina l'app in Applicazioni. L'app non è firmata da Apple, quindi al primo avvio macOS dirà che è "danneggiata". Non lo è: apri il Terminale e lancia una volta questo comando, poi riaprila normalmente:

            ```bash
            xattr -dr com.apple.quarantine "/Applications/GECOWAVE - The Flux of Coscience.app"
            ```

            **Linux** — rendi eseguibile l'`.AppImage` (`chmod +x`) e lancialo.

            ---
